<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UniLit Wallet</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1280px;
        height: 800px;
        background: #2c313a;
        font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .popup {
        width: 400px;
        height: 628px;
        border-radius: 16px;
        overflow: hidden;
        background: #070606;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }
      .popup img {
        width: 400px;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="popup">
      <img src="wallet-home.png" alt="" />
    </div>
  </body>
</html>
