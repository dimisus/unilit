<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UniLit Wallet</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1280px;
        height: 800px;
        background: #2c313a;
        font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .popup {
        width: 400px;
        height: 640px;
        background: #070606;
        border-radius: 16px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        padding: 72px 28px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
      }
      .brand img { width: 48px; height: 48px; }
      .brand span {
        color: #fff;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .subtitle {
        margin: 48px 8px 0;
        color: rgba(255, 255, 255, 0.55);
        font-size: 15px;
        line-height: 1.45;
        text-align: center;
      }
      .actions {
        width: 100%;
        margin-top: 48px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      button {
        width: 100%;
        height: 48px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
      }
      .primary {
        border: 0;
        color: #fff;
        background: linear-gradient(103.92deg, #6b9ad4 0%, #345d9d 100%);
      }
      .secondary {
        color: #fff;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="popup">
      <div class="brand">
        <img src="../build/_raw/images/logo/wallet-logo.png" alt="" />
        <span>UNILIT</span>
      </div>
      <p class="subtitle">Open-source Litecoin wallet for Chrome. Store LTC and connect to Litecoin sites.</p>
      <div class="actions">
        <button class="primary">Create new wallet</button>
        <button class="secondary">I already have a wallet</button>
        <button class="secondary">Connect to Hardware Wallet</button>
      </div>
    </div>
  </body>
</html>
