<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UniLit promo tile</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 440px;
        height: 280px;
        background: #070606;
        font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
      }
      img { width: 96px; height: 96px; }
      h1 {
        margin: 0;
        color: #fff;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 6px 0 0;
        color: #9ec0f0;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <img src="../build/_raw/images/logo/logo@128x.png" alt="" />
    <div>
      <h1>UniLit Wallet</h1>
      <p>Litecoin for Chrome</p>
    </div>
  </body>
</html>
