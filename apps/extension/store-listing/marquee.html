<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UniLit marquee promo tile</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1400px;
        height: 560px;
        background: #070606;
        font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
      }
      img { width: 200px; height: 200px; }
      h1 {
        margin: 0;
        color: #fff;
        font-size: 72px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      p {
        margin: 16px 0 0;
        color: #9ec0f0;
        font-size: 32px;
        font-weight: 600;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <img src="../build/_raw/images/logo/wallet-logo.png" alt="" />
    <div>
      <h1>UniLit Wallet</h1>
      <p>Litecoin for Chrome</p>
    </div>
  </body>
</html>
